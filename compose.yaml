name: sgv-comercial-dte
x-common: &common
  DTE_SERVICE_KEY: ${DTE_SERVICE_KEY:?Ejecuta bash scripts/demo.sh prepare}
  ConnectionStrings__Sgv: Server=sqlserver,1433;Database=SgvDemo;User Id=sa;Password=${SGV_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${SGV_SQL_PASSWORD:?Falta SGV_SQL_PASSWORD}
      SQLCMDPASSWORD: ${SGV_SQL_PASSWORD}
    ports: ["127.0.0.1:14338:1433"]
    volumes: ["sql-data:/var/opt/mssql"]
    healthcheck:
      test:
        [
          CMD-SHELL,
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q 'SELECT 1'",
        ]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
  setup:
    profiles: [tools]
    build:
      context: .
      dockerfile: Dockerfile.dotnet
      args:
        {
          PROJECT: tools/SGV.DemoSetup/SGV.DemoSetup.csproj,
          ASSEMBLY: SGV.DemoSetup.dll,
        }
    environment:
      <<: *common
      DTE_CERTIFICATE_PASSWORD: ${DTE_CERTIFICATE_PASSWORD}
    volumes: ["./.local/certificates:/certificates"]
    command: [migrate]
  receptor:
    build:
      context: .
      dockerfile: Dockerfile.dotnet
      args:
        {
          PROJECT: dte-service/SGV.ReceptorPruebas/SGV.ReceptorPruebas.csproj,
          ASSEMBLY: SGV.ReceptorPruebas.dll,
        }
    environment:
      <<: *common
      DTE_PUBLIC_CERTIFICATE_PATH: /certificates/public.cer
      FaultInjection__Enabled: "true"
    volumes: ["./.local/certificates/public.cer:/certificates/public.cer:ro"]
    ports: ["127.0.0.1:5082:8080"]
    depends_on: { sqlserver: { condition: service_healthy } }
  dte:
    build:
      context: .
      dockerfile: Dockerfile.dotnet
      args:
        { PROJECT: dte-service/SGV.Dte/SGV.Dte.csproj, ASSEMBLY: SGV.Dte.dll }
    environment:
      <<: *common
      DTE_CERTIFICATE_PATH: /certificates/firma.p12
      DTE_CERTIFICATE_PASSWORD: ${DTE_CERTIFICATE_PASSWORD}
      Receiver__Url: http://receptor:8080/api/receptor-pruebas/recepciondte
    volumes: ["./.local/certificates/firma.p12:/certificates/firma.p12:ro"]
    ports: ["127.0.0.1:5081:8080"]
    depends_on: [receptor]
  api:
    build:
      context: .
      dockerfile: Dockerfile.dotnet
      args: { PROJECT: backend/SGV.Api/SGV.Api.csproj, ASSEMBLY: SGV.Api.dll }
    environment:
      <<: *common
      SGV_JWT_KEY: ${SGV_JWT_KEY}
      SGV_ADMIN_USERNAME: admin
      SGV_ADMIN_PASSWORD: ${SGV_ADMIN_PASSWORD}
      Services__DteUrl: http://dte:8080/
      Demo__Enabled: "true"
    ports: ["127.0.0.1:5080:8080"]
    depends_on: [dte]
  frontend:
    build: { context: ., dockerfile: frontend/Dockerfile }
    ports: ["127.0.0.1:5173:80"]
    depends_on: [api]
volumes:
  sql-data:
